[project]
name = "mcp-image"
version = "0.2.0"
description = "MCP server that fetches images from URLs or local files and returns them compressed for LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0,<3",
    "pillow>=13.0.0",
]

[project.scripts]
mcp-image = "mcp_image:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mcp_image"]
